<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMS - Powered by Shigosag</title>

    <!-- Browser Favicon (SVG) -->
    <link rel="icon" type="image/svg+xml" href="/og-icon.svg" />

    <!-- Open Graph (OG) Meta Tags for Social Media Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://business-management-system-theta.vercel.app/" />
    <meta property="og:title" content="Shigosag BMS - Business Management System" />
    <meta property="og:description" content="A modern Business Management System built with React, TypeScript, Express, and PostgreSQL." />
    <!-- Social platforms require PNG/JPG for preview cards -->
    <meta property="og:image" content="https://business-management-system-theta.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shigosag BMS - Business Management System" />
    <meta name="twitter:description" content="A modern Business Management System built with React, TypeScript, Express, and PostgreSQL." />
    <meta name="twitter:image" content="https://business-management-system-theta.vercel.app/og-image.png" />

    <!-- External Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: { colors: { brand: "#ff0000" } }
        }
      };
    </script>
  </head>

  <body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
