version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: businessdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bms_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/businessdb?schema=public"
      NODE_ENV: production
      JWT_SECRET: super_secure_production_secret
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bms_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
